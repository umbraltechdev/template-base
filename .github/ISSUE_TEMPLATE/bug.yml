name: Bug
description: Reportar un error
labels: [bug]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options: [dev, staging, prod]
    validations:
      required: true
